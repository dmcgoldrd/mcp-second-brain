[project]
name = "mcp-brain-benchmarks"
version = "0.1.0"
description = "Isolated benchmark suite for MCP Brain — LoCoMo memory evaluation"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "pydantic>=2.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
